services:
  postgres:
    image: postgres:15
    container_name: mini-erp-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - mini-erp-data:/var/lib/postgresql/data

volumes:
  mini-erp-data: